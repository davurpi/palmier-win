[package]
name = "palmier-win"
version = "0.2.0"
description = "Palmier Win — video editor built for AI (Windows/macOS port of the Palmier Pro concept, FFmpeg engine)"
authors = ["Synkiria"]
edition = "2021"

[lib]
name = "palmier_win_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = "0.25"
ab_glyph = "0.2"
